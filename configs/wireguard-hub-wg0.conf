# /etc/wireguard/wg0.conf on the HUB (cloud VM). Spokes are the two home machines.
# Generate keys on each machine:  wg genkey | tee privatekey | wg pubkey > publickey
# Never commit real keys. Open UDP 51820 in the cloud network security group.
[Interface]
Address = 10.60.0.1/24
ListenPort = 51820
PrivateKey = HUB_PRIVATE_KEY
# Let the hub forward traffic between spokes (also: sysctl -w net.ipv4.ip_forward=1)
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT

[Peer]    # home machine 1 (control plane)
PublicKey = KUBE1_PUBLIC_KEY
AllowedIPs = 10.60.0.2/32

[Peer]    # home machine 2 (worker)
PublicKey = KUBE2_PUBLIC_KEY
AllowedIPs = 10.60.0.3/32
