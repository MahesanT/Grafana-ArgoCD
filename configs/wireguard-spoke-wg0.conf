# /etc/wireguard/wg0.conf on a SPOKE (home machine). Change Address on each machine (10.60.0.2, 10.60.0.3).
[Interface]
Address = 10.60.0.2/24
PrivateKey = SPOKE_PRIVATE_KEY

[Peer]    # the hub
PublicKey = HUB_PUBLIC_KEY
Endpoint = HUB_PUBLIC_IP:51820
AllowedIPs = 10.60.0.0/24       # reach the hub and the other spoke through the hub
PersistentKeepalive = 25        # keeps the NAT mapping open on a home router
